name: REALMat — testar automação central

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Validar contrato central
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verificar arquitetura
        run: python3 scripts/verify_architecture.py
      - name: Verificar backend
        run: python3 scripts/test_pretext_contract.py
