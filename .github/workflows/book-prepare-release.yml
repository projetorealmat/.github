name: REALMat — preparar Release PR do livro

on:
  workflow_call:
    inputs:
      config:
        description: Arquivo de configuração do livro
        required: false
        type: string
        default: .realmat/book.json
      version:
        description: Próxima versão no formato MAJOR.MINOR.PATCH
        required: true
        type: string
      release_date:
        description: Data da publicação (AAAA-MM-DD); vazia usa a data UTC
        required: false
        type: string
        default: ""
    secrets:
      REALMAT_AUTOMATION_PRIVATE_KEY:
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: realmat-prepare-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Criar Release PR
    runs-on: ubuntu-24.04
    steps:
      - name: Criar token da REALMat Automation
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.REALMAT_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.REALMAT_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout da branch padrão
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Validar configuração e preparar metadados
        id: release
        env:
          CONFIG: ${{ inputs.config }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_DATE: ${{ inputs.release_date }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${CONFIG}" "${REQUESTED_VERSION}" "${REQUESTED_DATE}" <<'PY'
          import json
          import os
          import re
          import sys
          from datetime import date, datetime, timezone
          from pathlib import Path

          config_path, version, requested_date = sys.argv[1:]
          config = json.loads(Path(config_path).read_text(encoding="utf-8"))
          required = ("id", "title", "short_title", "subject", "pdf_name", "build_system")
          missing = [key for key in required if not config.get(key)]
          if missing:
              raise SystemExit(f"Configuração incompleta: {', '.join(missing)}")
          if not re.fullmatch(r"[a-z0-9][a-z0-9-]*", config["id"]):
              raise SystemExit("id inválido.")
          if config["build_system"] not in {"latex", "pretext"}:
              raise SystemExit("build_system deve ser latex ou pretext.")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*", config["pdf_name"]):
              raise SystemExit("pdf_name inválido.")
          if re.fullmatch(r"\d+\.\d+\.\d+", version) is None:
              raise SystemExit("A versão deve seguir MAJOR.MINOR.PATCH.")
          citation_file = config.get("citation_file", "CITATION.cff")
          readme_file = config.get("readme_file", "README.md")
          citation = Path(citation_file).read_text(encoding="utf-8")
          current_match = re.search(
              r"^version:\s*[\"']?(\d+\.\d+\.\d+)[\"']?\s*$",
              citation,
              re.MULTILINE,
          )
          if current_match is None:
              raise SystemExit("CITATION.cff não contém version.")
          if tuple(map(int, version.split("."))) <= tuple(map(int, current_match.group(1).split("."))):
              raise SystemExit("A nova versão deve ser maior que a versão atual.")
          release_date = requested_date or datetime.now(timezone.utc).date().isoformat()
          try:
              date.fromisoformat(release_date)
          except ValueError as error:
              raise SystemExit("release_date inválida.") from error
          base_branch = config.get("base_branch", os.environ.get("GITHUB_REF_NAME", "main"))
          if not re.fullmatch(r"[A-Za-z0-9._/-]+", base_branch) or base_branch.startswith("/"):
              raise SystemExit("base_branch inválida.")
          readme_start = config.get("readme_release_start", "<!-- realmat-release:start -->")
          readme_end = config.get("readme_release_end", "<!-- realmat-release:end -->")
          if (
              not isinstance(readme_start, str)
              or not isinstance(readme_end, str)
              or not readme_start.strip()
              or not readme_end.strip()
              or "\n" in readme_start
              or "\n" in readme_end
          ):
              raise SystemExit("Marcadores do README inválidos.")
          release_tag = f"v{version}"
          release_branch = f"release/{release_tag}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in {
                  "base_branch": base_branch,
                  "release_date": release_date,
                  "release_tag": release_tag,
                  "release_branch": release_branch,
                  "citation_file": citation_file,
                  "readme_file": readme_file,
                  "readme_start": readme_start,
                  "readme_end": readme_end,
              }.items():
                  output.write(f"{key}={value}\n")
          PY

          if git ls-remote --exit-code --refs origin "refs/tags/${{ steps.release.outputs.release_tag }}" >/dev/null 2>&1; then
            echo "A tag já existe."
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "${{ steps.release.outputs.release_branch }}" >/dev/null 2>&1; then
            echo "A branch de release já existe."
            exit 1
          fi

      - name: Atualizar CITATION.cff e README
        env:
          CONFIG: ${{ inputs.config }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_DATE: ${{ steps.release.outputs.release_date }}
          CITATION_FILE: ${{ steps.release.outputs.citation_file }}
          README_FILE: ${{ steps.release.outputs.readme_file }}
          README_START: ${{ steps.release.outputs.readme_start }}
          README_END: ${{ steps.release.outputs.readme_end }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${CONFIG}" "${RELEASE_TAG}" "${RELEASE_DATE}" "${CITATION_FILE}" "${README_FILE}" "${README_START}" "${README_END}" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          _, tag, release_date, citation_name, readme_name, start, end = sys.argv[1:]
          citation_path = Path(citation_name)
          citation = citation_path.read_text(encoding="utf-8")
          citation, count = re.subn(
              r"^version:\s*.*$",
              f'version: "{tag[1:]}"',
              citation,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("Não foi possível atualizar version.")
          date_pattern = r"^date-released:\s*.*$"
          if re.search(date_pattern, citation, re.MULTILINE):
              citation = re.sub(date_pattern, f"date-released: {release_date}", citation, count=1, flags=re.MULTILINE)
          else:
              citation = citation.rstrip() + f"\ndate-released: {release_date}\n"
          citation_path.write_text(citation, encoding="utf-8")

          readme_path = Path(readme_name)
          readme = readme_path.read_text(encoding="utf-8")
          if readme.count(start) != 1 or readme.count(end) != 1:
              raise SystemExit("README precisa conter os marcadores REALMat.")
          repository = os.environ["GITHUB_REPOSITORY"]
          replacement = (
              f"{start}\n"
              f"- Release REALMat atualmente recomendada: "
              f"[{tag}](https://github.com/{repository}/releases/tag/{tag}).\n"
              f"{end}"
          )
          readme = re.sub(re.escape(start) + r".*?" + re.escape(end), replacement, readme, count=1, flags=re.DOTALL)
          readme_path.write_text(readme, encoding="utf-8")
          PY
          git diff --check

      - name: Criar Release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_BRANCH: ${{ steps.release.outputs.base_branch }}
          RELEASE_BRANCH: ${{ steps.release.outputs.release_branch }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_DATE: ${{ steps.release.outputs.release_date }}
          CITATION_FILE: ${{ steps.release.outputs.citation_file }}
          README_FILE: ${{ steps.release.outputs.readme_file }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "REALMat Automation"
          git config user.email "realmat-automation[bot]@users.noreply.github.com"
          git switch -c "${RELEASE_BRANCH}"
          git add "${CITATION_FILE}" "${README_FILE}"
          git commit -m "chore(release): prepare ${RELEASE_TAG}"
          git push --set-upstream origin "${RELEASE_BRANCH}"
          cat > "${RUNNER_TEMP}/release-pr.md" <<EOF
          ## Release PR — ${RELEASE_TAG}

          Esta PR prepara a publicação da edição REALMat ${RELEASE_TAG} em ${RELEASE_DATE}.
          O merge desta PR autoriza a compilação e a publicação automáticas.
          EOF
          gh pr create --base "${BASE_BRANCH}" --head "${RELEASE_BRANCH}" \
            --title "release: ${GITHUB_REPOSITORY##*/} ${RELEASE_TAG}" \
            --body-file "${RUNNER_TEMP}/release-pr.md"
