name: REALMat — publicar release do livro

on:
  workflow_call:
    inputs:
      config:
        description: Arquivo de configuração do livro
        required: false
        type: string
        default: .realmat/book.json
      release_pr:
        description: Número de uma Release PR já mesclada, para reexecução manual
        required: false
        type: string
        default: ""
    secrets:
      REALMAT_AUTOMATION_PRIVATE_KEY:
        required: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: realmat-publish-release-${{ github.repository }}-${{ inputs.release_pr || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolver Release PR
    runs-on: ubuntu-24.04
    outputs:
      release_pr: ${{ steps.resolve.outputs.release_pr }}
      release_commit: ${{ steps.resolve.outputs.release_commit }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      base_branch: ${{ steps.resolve.outputs.base_branch }}
    steps:
      - name: Checkout da branch padrão
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validar Release PR
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG: ${{ inputs.config }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          REQUESTED_PR: ${{ inputs.release_pr }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            pr_number="${EVENT_PR}"
          else
            pr_number="${REQUESTED_PR}"
          fi
          [[ "${pr_number}" =~ ^[0-9]+$ ]] || { echo "Número da PR inválido."; exit 1; }
          base_branch="$(python3 - "${CONFIG}" <<'PY'
          import json
          import sys
          from pathlib import Path
          import os
          config = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(config.get("base_branch", os.environ.get("DEFAULT_BRANCH", "main")))
          PY
          )"
          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}")"
          merged="$(jq -r '.merged' <<< "${pr_json}")"
          base_ref="$(jq -r '.base.ref' <<< "${pr_json}")"
          head_ref="$(jq -r '.head.ref' <<< "${pr_json}")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<< "${pr_json}")"
          merge_commit="$(jq -r '.merge_commit_sha // ""' <<< "${pr_json}")"
          [[ "${merged}" == "true" ]] || { echo "A Release PR não foi mesclada."; exit 1; }
          [[ "${base_ref}" == "${base_branch}" ]] || { echo "A base da PR não coincide com a configuração."; exit 1; }
          [[ "${head_repo}" == "${REPOSITORY}" ]] || { echo "A Release PR deve ser interna."; exit 1; }
          [[ "${head_ref}" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Branch de release inválida."; exit 1; }
          [[ "${merge_commit}" =~ ^[0-9a-f]{40}$ ]] || { echo "Commit mesclado inválido."; exit 1; }
          git fetch --no-tags origin "${base_branch}"
          git merge-base --is-ancestor "${merge_commit}" "origin/${base_branch}" || {
            echo "O commit da Release PR não está na branch base."
            exit 1
          }
          {
            echo "release_pr=${pr_number}"
            echo "release_commit=${merge_commit}"
            echo "release_tag=${head_ref#release/}"
            echo "base_branch=${base_branch}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Compilar e publicar release
    needs: resolve
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    outputs:
      pdf_sha256: ${{ steps.package.outputs.pdf_sha256 }}
      release_date: ${{ steps.metadata.outputs.release_date }}
      release_status: ${{ steps.metadata.outputs.release_status }}
      pdf_name: ${{ steps.config.outputs.pdf_name }}
      portal_repository: ${{ steps.config.outputs.portal_repository }}
      portal_name: ${{ steps.config.outputs.portal_name }}
      book_id: ${{ steps.config.outputs.book_id }}
      book_title: ${{ steps.config.outputs.book_title }}
      book_short_title: ${{ steps.config.outputs.book_short_title }}
      book_subject: ${{ steps.config.outputs.book_subject }}
    steps:
      - name: Checkout do commit da release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_commit }}
          fetch-depth: 0

      - name: Checkout dos scripts REALMat
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .realmat-central

      - name: Ler configuração
        id: config
        env:
          CONFIG: ${{ inputs.config }}
          PORTAL_DEFAULT: projetorealmat/projetorealmat.github.io
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${CONFIG}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          config = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          portal = config.get("portal_repository", os.environ["PORTAL_DEFAULT"])
          owner, name = portal.split("/", 1)
          pretext_generate = config.get("pretext_generate", True)
          if not isinstance(pretext_generate, bool):
              raise SystemExit("pretext_generate deve ser booleano.")
          for key in ("pretext_cached_assets_source", "pretext_cached_assets_destination"):
              value = config.get(key, "")
              if not isinstance(value, str):
                  raise SystemExit(f"{key} deve ser uma string quando informado.")
              path = Path(value)
              if value and (path.is_absolute() or ".." in path.parts):
                  raise SystemExit(f"{key} deve ser um caminho relativo e seguro.")
          values = {
              "build_system": config["build_system"],
              "pdf_name": config["pdf_name"],
              "pretext_project_file": config.get("pretext_project_file", ""),
              "pretext_pdf_target": config.get("pretext_pdf_target", ""),
              "pretext_web_target": config.get("pretext_web_target", ""),
              "pretext_requirements_file": config.get("pretext_requirements_file", "requirements.txt"),
              "pretext_generate": "true" if pretext_generate else "false",
              "pretext_cached_assets_source": config.get("pretext_cached_assets_source", ""),
              "pretext_cached_assets_destination": config.get("pretext_cached_assets_destination", "generated-assets"),
              "latex_entrypoint": config.get("latex_entrypoint", ""),
              "latex_engine": config.get("latex_engine", "xelatex"),
              "validation_script": config.get("validation_script", ""),
              "source_url": config.get("source_url", ""),
              "source_license": config.get("source_license", ""),
              "portal_repository": portal,
              "portal_name": name,
              "book_id": config["id"],
              "book_title": config["title"],
              "book_short_title": config["short_title"],
              "book_subject": config["subject"],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          PY

      - name: Ler versão e status editorial
        id: metadata
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          CITATION_FILE: ${{ inputs.config }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${CITATION_FILE}" "${RELEASE_TAG}" <<'PY'
          import json
          import os
          import re
          import sys
          from datetime import date
          from pathlib import Path

          config = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          tag = sys.argv[2]
          citation = Path(config.get("citation_file", "CITATION.cff")).read_text(encoding="utf-8")
          version = re.search(r"^version:\s*[\"']?(\d+\.\d+\.\d+)[\"']?\s*$", citation, re.MULTILINE)
          released = re.search(r"^date-released:\s*(\d{4}-\d{2}-\d{2})\s*$", citation, re.MULTILINE)
          if version is None or released is None or f"v{version.group(1)}" != tag:
              raise SystemExit("CITATION.cff não coincide com a tag da Release PR.")
          major, minor, patch = map(int, version.group(1).split("."))
          status = (
              "em revisão" if major == 0 else
              "tradução aprovada" if (major, minor, patch) == (1, 0, 0) else
              "versão revisada" if major == 1 else
              "nova versão"
          )
          date.fromisoformat(released.group(1))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release_date={released.group(1)}\n")
              output.write(f"release_status={status}\n")
          PY

      - name: Validar conteúdo específico do livro
        if: ${{ steps.config.outputs.validation_script != '' }}
        env:
          VALIDATION_SCRIPT: ${{ steps.config.outputs.validation_script }}
        shell: bash
        run: python3 "${VALIDATION_SCRIPT}"

      - name: Configurar Python
        if: ${{ steps.config.outputs.build_system == 'pretext' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar dependências de compilação
        env:
          BUILD_SYSTEM: ${{ steps.config.outputs.build_system }}
          PRETEXT_REQUIREMENTS_FILE: ${{ steps.config.outputs.pretext_requirements_file }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            texlive-full \
            latexmk \
            poppler-utils \
            pdf2svg \
            nodejs \
            npm
          if [[ "${BUILD_SYSTEM}" == "pretext" ]]; then
            # PreTeXt 2.44.0 ainda depende do comportamento de entidades externas
            # anterior ao lxml 6.1.3.
            python -m pip install --requirement "${PRETEXT_REQUIREMENTS_FILE}" "lxml<6.1.3"
          fi

      - name: Compilar PDF
        env:
          BUILD_SYSTEM: ${{ steps.config.outputs.build_system }}
          PDF_NAME: ${{ steps.config.outputs.pdf_name }}
          PRETEXT_PROJECT_FILE: ${{ steps.config.outputs.pretext_project_file }}
          PRETEXT_PDF_TARGET: ${{ steps.config.outputs.pretext_pdf_target }}
          PRETEXT_WEB_TARGET: ${{ steps.config.outputs.pretext_web_target }}
          PRETEXT_GENERATE: ${{ steps.config.outputs.pretext_generate }}
          PRETEXT_CACHED_ASSETS_SOURCE: ${{ steps.config.outputs.pretext_cached_assets_source }}
          PRETEXT_CACHED_ASSETS_DESTINATION: ${{ steps.config.outputs.pretext_cached_assets_destination }}
          LATEX_ENTRYPOINT: ${{ steps.config.outputs.latex_entrypoint }}
          LATEX_ENGINE: ${{ steps.config.outputs.latex_engine }}
        shell: bash
        run: bash .realmat-central/scripts/build-book.sh

      - name: Empacotar fontes e checksum
        id: package
        env:
          PDF_NAME: ${{ steps.config.outputs.pdf_name }}
          SOURCE_PREFIX: ${{ steps.config.outputs.book_id }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.release_commit }}
          RELEASE_DATE: ${{ steps.metadata.outputs.release_date }}
          RELEASE_STATUS: ${{ steps.metadata.outputs.release_status }}
          RELEASE_PR: ${{ needs.resolve.outputs.release_pr }}
          SOURCE_URL: ${{ steps.config.outputs.source_url }}
        shell: bash
        run: |
          set -euo pipefail
          metadata_file="${SOURCE_PREFIX}-${RELEASE_TAG}-metadata.txt"
          source_dir="${SOURCE_PREFIX}-${RELEASE_TAG}-source"
          source_asset="${source_dir}.tar.gz"
          {
            printf 'Livro: %s\n' "${GITHUB_REPOSITORY}"
            printf 'Versão: %s\n' "${RELEASE_TAG}"
            printf 'Data de publicação: %s\n' "${RELEASE_DATE}"
            printf 'Status editorial: %s\n' "${RELEASE_STATUS}"
            printf 'Commit: %s\n' "${RELEASE_COMMIT}"
            printf 'Release PR: #%s\n' "${RELEASE_PR}"
            if [[ -n "${SOURCE_URL:-}" ]]; then
              printf 'Fonte upstream: %s\n' "${SOURCE_URL}"
            fi
          } > "${metadata_file}"
          git archive --format=tar --prefix="${source_dir}/" "${RELEASE_COMMIT}" | tar -x
          cp "${metadata_file}" "${source_dir}/"
          tar -czf "${source_asset}" "${source_dir}"
          sha256sum "${PDF_NAME}" "${source_asset}" "${metadata_file}" > SHA256SUMS
          pdf_sha256="$(sha256sum "${PDF_NAME}" | awk '{print $1}')"
          echo "pdf_sha256=${pdf_sha256}" >> "${GITHUB_OUTPUT}"
          echo "METADATA_FILE=${metadata_file}" >> "${GITHUB_ENV}"
          echo "SOURCE_ASSET=${source_asset}" >> "${GITHUB_ENV}"

      - name: Criar ou validar tag imutável
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.release_commit }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --refs origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            [[ "$(git rev-list -n 1 "${RELEASE_TAG}^{commit}")" == "${RELEASE_COMMIT}" ]] || {
              echo "A tag ${RELEASE_TAG} já existe e aponta para outro commit."
              exit 1
            }
          else
            git tag -a "${RELEASE_TAG}" "${RELEASE_COMMIT}" -m "${GITHUB_REPOSITORY##*/} ${RELEASE_TAG}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.release_commit }}
          RELEASE_STATUS: ${{ steps.metadata.outputs.release_status }}
          PDF_NAME: ${{ steps.config.outputs.pdf_name }}
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          [[ "${RELEASE_STATUS}" == "em revisão" ]] && flags+=(--prerelease)
          assets=("${PDF_NAME}" "${SOURCE_ASSET}" "${METADATA_FILE}" SHA256SUMS)
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            release_json="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName,isDraft,isPrerelease)"
            [[ "$(jq -r '.tagName' <<< "${release_json}")" == "${RELEASE_TAG}" ]] || {
              echo "A Release existente não corresponde à tag esperada."
              exit 1
            }
            expected_prerelease=false
            [[ "${RELEASE_STATUS}" == "em revisão" ]] && expected_prerelease=true
            actual_prerelease="$(jq -r '.isPrerelease' <<< "${release_json}")"
            [[ "$(jq -r '.isDraft' <<< "${release_json}")" == "true" || "${actual_prerelease}" == "${expected_prerelease}" ]] || {
              echo "A Release existente tem status incompatível."
              exit 1
            }
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
            if [[ "$(jq -r '.isDraft' <<< "${release_json}")" == "true" ]]; then
              if [[ "${RELEASE_STATUS}" == "em revisão" ]]; then
                gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --prerelease
              else
                gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --prerelease=false
              fi
            fi
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${RELEASE_COMMIT}" \
              --title "${GITHUB_REPOSITORY##*/} ${RELEASE_TAG}" \
              --generate-notes "${flags[@]}"
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}"
          fi

      - name: Verificar PDF publicado
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          PDF_NAME: ${{ steps.config.outputs.pdf_name }}
          EXPECTED_SHA256: ${{ steps.package.outputs.pdf_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          published_dir="${RUNNER_TEMP}/published-release"
          mkdir -p "${published_dir}"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${PDF_NAME}" \
            --dir "${published_dir}" \
            --clobber
          actual_sha256="$(sha256sum "${published_dir}/${PDF_NAME}" | awk '{print $1}')"
          [[ "${actual_sha256}" == "${EXPECTED_SHA256}" ]] || {
            echo "O SHA-256 do PDF publicado diverge do build final."
            exit 1
          }

  dispatch:
    name: Enviar release ao catálogo
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Criar token da REALMat Automation para o portal
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.REALMAT_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.REALMAT_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ needs.build.outputs.portal_name }}

      - name: Montar payload do catálogo
        env:
          PDF_NAME: ${{ needs.build.outputs.pdf_name }}
          PDF_SHA256: ${{ needs.build.outputs.pdf_sha256 }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          RELEASE_DATE: ${{ needs.build.outputs.release_date }}
          RELEASE_STATUS: ${{ needs.build.outputs.release_status }}
          BOOK_ID: ${{ needs.build.outputs.book_id }}
          BOOK_TITLE: ${{ needs.build.outputs.book_title }}
          BOOK_SHORT_TITLE: ${{ needs.build.outputs.book_short_title }}
          BOOK_SUBJECT: ${{ needs.build.outputs.book_subject }}
          SOURCE_URL: ${{ needs.build.outputs.source_url }}
          SOURCE_LICENSE: ${{ needs.build.outputs.source_license }}
          PORTAL_REPOSITORY: ${{ needs.build.outputs.portal_repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          book = {
              "id": os.environ["BOOK_ID"],
              "title": os.environ["BOOK_TITLE"],
              "short_title": os.environ["BOOK_SHORT_TITLE"],
              "subject": os.environ["BOOK_SUBJECT"],
              "version": tag,
              "status": os.environ["RELEASE_STATUS"],
              "repository": repository,
              "ref": tag,
              "release_url": f"https://github.com/{repository}/releases/tag/{tag}",
              "pdf_url": f"https://github.com/{repository}/releases/download/{tag}/{os.environ['PDF_NAME']}",
              "pdf_path": f"/assets/books/{os.environ['BOOK_ID']}/{tag}/{os.environ['PDF_NAME']}",
              "sha256": os.environ["PDF_SHA256"],
              "release_date": os.environ["RELEASE_DATE"],
          }
          for key in ("source_url", "source_license"):
              if os.environ.get(key):
                  book[key] = os.environ[key]
          payload = {"event_type": "book-release", "client_payload": {"book": book}}
          Path("catalog-dispatch.json").write_text(json.dumps(payload, ensure_ascii=False), encoding="utf-8")
          PY

      - name: Enviar evento ao portal
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PORTAL_REPOSITORY: ${{ needs.build.outputs.portal_repository }}
        run: gh api --method POST "repos/${PORTAL_REPOSITORY}/dispatches" --input catalog-dispatch.json
