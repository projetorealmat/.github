name: REALMat — publicar release do livro

on:
  workflow_call:
    inputs:
      config:
        description: Caminho do arquivo JSON de configuração do livro
        required: false
        type: string
        default: .realmat/book.json
      base_branch:
        description: Branch base usada para a Release PR
        required: false
        type: string
        default: main
      release_pr:
        description: Número de uma Release PR já mesclada para recuperação manual
        required: false
        type: string
        default: ""
    secrets:
      REALMAT_AUTOMATION_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: realmat-publish-release-${{ github.repository }}-${{ inputs.release_pr || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolver Release PR
    runs-on: ubuntu-24.04
    outputs:
      release_pr_number: ${{ steps.resolve.outputs.release_pr_number }}
      release_commit: ${{ steps.resolve.outputs.release_commit }}
      release_base_sha: ${{ steps.resolve.outputs.release_base_sha }}
      release_branch: ${{ steps.resolve.outputs.release_branch }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      release_version: ${{ steps.metadata.outputs.release_version }}
      release_date: ${{ steps.metadata.outputs.release_date }}
      release_status: ${{ steps.metadata.outputs.release_status }}
      release_is_prerelease: ${{ steps.metadata.outputs.release_is_prerelease }}
      pdf_name: ${{ steps.config.outputs.pdf_name }}
      build_system: ${{ steps.config.outputs.build_system }}
      pretext_project_file: ${{ steps.config.outputs.pretext_project_file }}
      pretext_pdf_target: ${{ steps.config.outputs.pretext_pdf_target }}
      pretext_web_target: ${{ steps.config.outputs.pretext_web_target }}
      pretext_checksum_file: ${{ steps.config.outputs.pretext_checksum_file }}
      source_prefix: ${{ steps.config.outputs.source_prefix }}
      tex_entrypoint: ${{ steps.config.outputs.tex_entrypoint }}
      build_metadata_file: ${{ steps.config.outputs.build_metadata_file }}
      validation_script: ${{ steps.config.outputs.validation_script }}
      portal_repository: ${{ steps.config.outputs.portal_repository }}
      portal_name: ${{ steps.config.outputs.portal_name }}
      book_id: ${{ steps.config.outputs.book_id }}
      book_title: ${{ steps.config.outputs.book_title }}
      book_short_title: ${{ steps.config.outputs.book_short_title }}
      book_subject: ${{ steps.config.outputs.book_subject }}
      pdf_version_marker: ${{ steps.config.outputs.pdf_version_marker }}
      pdf_status_marker: ${{ steps.config.outputs.pdf_status_marker }}

    steps:
      - name: Checkout da branch base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Resolver e validar a Release PR
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          REQUESTED_PR_NUMBER: ${{ inputs.release_pr }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            pr_number="${EVENT_PR_NUMBER}"
          else
            pr_number="${REQUESTED_PR_NUMBER}"
          fi
          if [[ ! "${pr_number}" =~ ^[0-9]+$ ]]; then
            echo "O número da Release PR deve ser um inteiro positivo."
            exit 1
          fi

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
          merged="$(jq -r '.merged' <<< "${pr_json}")"
          base_ref="$(jq -r '.base.ref' <<< "${pr_json}")"
          base_sha="$(jq -r '.base.sha' <<< "${pr_json}")"
          head_ref="$(jq -r '.head.ref' <<< "${pr_json}")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<< "${pr_json}")"
          merge_commit="$(jq -r '.merge_commit_sha // ""' <<< "${pr_json}")"

          [[ "${merged}" == "true" ]] || { echo "A PR #${pr_number} não foi mesclada."; exit 1; }
          [[ "${base_ref}" == "${BASE_BRANCH}" ]] || { echo "A Release PR deve ter ${BASE_BRANCH} como base."; exit 1; }
          [[ "${head_repo}" == "${GITHUB_REPOSITORY}" ]] || { echo "A Release PR deve ser interna."; exit 1; }
          [[ "${head_ref}" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Branch de release inválida."; exit 1; }
          [[ "${merge_commit}" =~ ^[0-9a-f]{40}$ ]] || { echo "Commit mesclado inválido."; exit 1; }
          [[ "${base_sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "Commit-base inválido."; exit 1; }

          git fetch --no-tags origin "${BASE_BRANCH}"
          git merge-base --is-ancestor "${merge_commit}" "origin/${BASE_BRANCH}" || {
            echo "O commit da Release PR deve estar contido em ${BASE_BRANCH}."
            exit 1
          }

          {
            echo "release_pr_number=${pr_number}"
            echo "release_commit=${merge_commit}"
            echo "release_base_sha=${base_sha}"
            echo "release_branch=${head_ref}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout do commit da release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.release_commit }}
          fetch-depth: 0

      - name: Ler configuração do livro
        id: config
        env:
          CONFIG: ${{ inputs.config }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${CONFIG}" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          config = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          build_system = config.get("build_system", "latex")
          if not isinstance(build_system, str) or build_system not in {"latex", "pretext"}:
              raise SystemExit("build_system deve ser 'latex' ou 'pretext'.")
          required = (
              "id", "title", "short_title", "subject", "pdf_name",
              "source_prefix", "portal_repository",
          )
          if build_system == "latex":
              required += (
                  "tex_entrypoint", "build_metadata_file",
                  "pdf_version_marker", "pdf_status_marker",
              )
          else:
              required += (
                  "pretext_project_file", "pretext_pdf_target",
                  "pretext_web_target",
              )
          missing = [key for key in required if not config.get(key)]
          if missing:
              raise SystemExit(f"Configuração do livro incompleta: {', '.join(missing)}")
          if "pretext_checksum_file" in config and not isinstance(config["pretext_checksum_file"], str):
              raise SystemExit("pretext_checksum_file deve ser uma string quando informado.")
          if not re.fullmatch(r"[^/\s]+/[^/\s]+", config["portal_repository"]):
              raise SystemExit("portal_repository inválido.")
          portal_name = config["portal_repository"].split("/", 1)[1]
          validation_script = config.get("validation_script", "")
          output = open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8")
          with output:
              values = {
                  "book_id": config["id"],
                  "pdf_name": config["pdf_name"],
                  "build_system": build_system,
                  "pretext_project_file": config.get("pretext_project_file", ""),
                  "pretext_pdf_target": config.get("pretext_pdf_target", ""),
                  "pretext_web_target": config.get("pretext_web_target", ""),
                  "pretext_checksum_file": config.get("pretext_checksum_file", ""),
                  "source_prefix": config["source_prefix"],
                  "tex_entrypoint": config.get("tex_entrypoint", ""),
                  "build_metadata_file": config.get("build_metadata_file", ""),
                  "validation_script": validation_script,
                  "portal_repository": config["portal_repository"],
                  "portal_name": portal_name,
                  "book_title": config["title"],
                  "book_short_title": config["short_title"],
                  "book_subject": config["subject"],
                  "pdf_version_marker": config.get("pdf_version_marker", ""),
                  "pdf_status_marker": config.get("pdf_status_marker", ""),
              }
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          PY

      - name: Validar metadados e imutabilidade
        id: metadata
        env:
          RELEASE_COMMIT: ${{ steps.resolve.outputs.release_commit }}
          RELEASE_BASE_SHA: ${{ steps.resolve.outputs.release_base_sha }}
          RELEASE_BRANCH: ${{ steps.resolve.outputs.release_branch }}
          CONFIG: ${{ inputs.config }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${CONFIG}" "${RELEASE_BASE_SHA}" "${RELEASE_COMMIT}" "${RELEASE_BRANCH}" <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from datetime import date
          from pathlib import Path

          config_path, base_sha, release_commit, release_branch = sys.argv[1:]
          config = json.loads(Path(config_path).read_text(encoding="utf-8"))
          citation_path = Path(config.get("citation_file", "CITATION.cff"))
          text = citation_path.read_text(encoding="utf-8")

          def field(name: str) -> str:
              match = re.search(
                  rf"^{re.escape(name)}:\s*[\"']?([^\s\"']+)[\"']?\s*$",
                  text,
                  re.MULTILINE,
              )
              if match is None:
                  raise SystemExit(f"CITATION.cff não contém {name} válido.")
              return match.group(1)

          version = field("version")
          release_date = field("date-released")
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("version inválida.")
          try:
              date.fromisoformat(release_date)
          except ValueError as error:
              raise SystemExit("date-released inválida.") from error
          tag = f"v{version}"
          if release_branch != f"release/{tag}":
              raise SystemExit("A branch da Release PR não coincide com a versão.")

          previous = subprocess.check_output(
              ["git", "show", f"{base_sha}:{citation_path}"], text=True
          )
          previous_match = re.search(
              r"^version:\s*[\"']?([0-9]+\.[0-9]+\.[0-9]+)[\"']?\s*$",
              previous,
              re.MULTILINE,
          )
          if previous_match is None or previous_match.group(1) == version:
              raise SystemExit("A Release PR deve aumentar a versão do CITATION.cff.")

          major, minor, patch = (int(part) for part in version.split("."))
          if major == 0:
              status, prerelease = "em revisão", "true"
          elif (major, minor, patch) == (1, 0, 0):
              status, prerelease = "tradução aprovada", "false"
          elif major == 1:
              status, prerelease = "versão revisada", "false"
          else:
              status, prerelease = "nova versão", "false"

          output = open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8")
          with output:
              output.write(f"release_tag={tag}\n")
              output.write(f"release_version={version}\n")
              output.write(f"release_date={release_date}\n")
              output.write(f"release_status={status}\n")
              output.write(f"release_is_prerelease={prerelease}\n")
          PY

  build-pretext:
    name: Compilar artefatos PreTeXt
    needs: resolve
    if: needs.resolve.outputs.build_system == 'pretext'
    uses: ./.github/workflows/book-build-pretext.yml
    with:
      release_commit: ${{ needs.resolve.outputs.release_commit }}
      release_tag: ${{ needs.resolve.outputs.release_tag }}
      release_status: ${{ needs.resolve.outputs.release_status }}
      pretext_project_file: ${{ needs.resolve.outputs.pretext_project_file }}
      pretext_pdf_target: ${{ needs.resolve.outputs.pretext_pdf_target }}
      pretext_web_target: ${{ needs.resolve.outputs.pretext_web_target }}
      pretext_checksum_file: ${{ needs.resolve.outputs.pretext_checksum_file }}
      pdf_name: ${{ needs.resolve.outputs.pdf_name }}
      pdf_version_marker: ${{ needs.resolve.outputs.pdf_version_marker }}
      pdf_status_marker: ${{ needs.resolve.outputs.pdf_status_marker }}

  build-latex:
    name: Compilar e publicar release
    needs: resolve
    if: needs.resolve.outputs.build_system == 'latex'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    outputs:
      pdf_sha256: ${{ steps.digest.outputs.pdf_sha256 }}

    env:
      RELEASE_PR_NUMBER: ${{ needs.resolve.outputs.release_pr_number }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.release_commit }}
      RELEASE_BASE_SHA: ${{ needs.resolve.outputs.release_base_sha }}
      RELEASE_BRANCH: ${{ needs.resolve.outputs.release_branch }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
      RELEASE_DATE: ${{ needs.resolve.outputs.release_date }}
      RELEASE_STATUS: ${{ needs.resolve.outputs.release_status }}
      RELEASE_IS_PRERELEASE: ${{ needs.resolve.outputs.release_is_prerelease }}
      PDF_NAME: ${{ needs.resolve.outputs.pdf_name }}
      BUILD_SYSTEM: ${{ needs.resolve.outputs.build_system }}
      PRETEXT_PROJECT_FILE: ${{ needs.resolve.outputs.pretext_project_file }}
      PRETEXT_PDF_TARGET: ${{ needs.resolve.outputs.pretext_pdf_target }}
      PRETEXT_WEB_TARGET: ${{ needs.resolve.outputs.pretext_web_target }}
      PRETEXT_CHECKSUM_FILE: ${{ needs.resolve.outputs.pretext_checksum_file }}
      SOURCE_PREFIX: ${{ needs.resolve.outputs.source_prefix }}
      TEX_ENTRYPOINT: ${{ needs.resolve.outputs.tex_entrypoint }}
      BUILD_METADATA_FILE: ${{ needs.resolve.outputs.build_metadata_file }}
      VALIDATION_SCRIPT: ${{ needs.resolve.outputs.validation_script }}
      PDF_VERSION_MARKER: ${{ needs.resolve.outputs.pdf_version_marker }}
      PDF_STATUS_MARKER: ${{ needs.resolve.outputs.pdf_status_marker }}

    steps:
      - name: Checkout do commit da release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_commit }}
          fetch-depth: 0

      - name: Criar metadados de compilação
        shell: bash
        run: |
          set -euo pipefail
          release_date_display="$(date -u -d "${RELEASE_DATE}" +%d/%m/%Y)"
          {
            printf '\\renewcommand*{\\editionversion}{%s}\n' "${RELEASE_TAG}"
            printf '\\renewcommand*{\\editiondate}{%s}\n' "${release_date_display}"
            printf '\\renewcommand*{\\editionstatus}{%s}\n' "${RELEASE_STATUS}"
          } > "${BUILD_METADATA_FILE}"

      - name: Validar alterações e marcadores editoriais
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${RELEASE_BASE_SHA}" "${RELEASE_COMMIT}"
          if [[ -n "${VALIDATION_SCRIPT}" ]]; then
            python3 "${VALIDATION_SCRIPT}" .
          fi

      - name: Instalar XeLaTeX e ferramentas do PDF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-lang-english \
            texlive-lang-portuguese \
            texlive-xetex \
            latexmk \
            poppler-utils

      - name: Registrar ambiente de compilação
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'Runner: ubuntu-24.04\n'
            printf 'XeLaTeX: '; xelatex --version | head -n1
            printf 'latexmk: '; latexmk --version | head -n1
            printf 'TeX engine: '; kpsewhich --version | head -n1
          } > build-environment.txt

      - name: Compilar PDF final
        shell: bash
        run: latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error "${TEX_ENTRYPOINT}"

      - name: Verificar marcadores do PDF
        shell: bash
        run: |
          set -euo pipefail
          pdftotext -layout "${PDF_NAME}" release-pdf-text.txt
          grep -Fq "${PDF_VERSION_MARKER}${RELEASE_TAG}" release-pdf-text.txt
          grep -Fq "${PDF_STATUS_MARKER}${RELEASE_STATUS}" release-pdf-text.txt

      - name: Empacotar fontes e checksums
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          metadata_file="${SOURCE_PREFIX}-${RELEASE_TAG}-metadata.txt"
          source_dir="${SOURCE_PREFIX}-${RELEASE_TAG}-source"
          source_asset="${source_dir}.tar.gz"
          release_date_display="$(date -u -d "${RELEASE_DATE}" +%d/%m/%Y)"
          {
            printf 'Livro: %s\n' "${GITHUB_REPOSITORY}"
            printf 'Versão: %s\n' "${RELEASE_TAG}"
            printf 'Data de publicação: %s\n' "${release_date_display}"
            printf 'Status editorial: %s\n' "${RELEASE_STATUS}"
            printf 'Commit: %s\n' "${RELEASE_COMMIT}"
            printf 'Release PR: #%s\n' "${RELEASE_PR_NUMBER}"
            printf 'Repositório: https://github.com/%s\n' "${GITHUB_REPOSITORY}"
          } > "${metadata_file}"
          git archive --format=tar --prefix="${source_dir}/" "${RELEASE_COMMIT}" | tar -x
          cp "${BUILD_METADATA_FILE}" "${source_dir}/"
          cp "${metadata_file}" "${source_dir}/"
          cp build-environment.txt "${source_dir}/"
          tar -czf "${source_asset}" "${source_dir}"
          sha256sum "${PDF_NAME}" "${source_asset}" "${metadata_file}" build-environment.txt > SHA256SUMS
          pdf_sha256="$(sha256sum "${PDF_NAME}" | awk '{print $1}')"
          echo "pdf_sha256=${pdf_sha256}" >> "${GITHUB_OUTPUT}"
          echo "RELEASE_METADATA=${metadata_file}" >> "${GITHUB_ENV}"
          echo "SOURCE_ASSET=${source_asset}" >> "${GITHUB_ENV}"

      - name: Criar ou validar tag imutável
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --refs origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" == "${RELEASE_COMMIT}" ]] || {
              echo "A tag ${RELEASE_TAG} aponta para outro commit."
              exit 1
            }
          else
            git tag -a "${RELEASE_TAG}" "${RELEASE_COMMIT}" -m "${SOURCE_PREFIX} ${RELEASE_TAG}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Criar ou completar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=("${PDF_NAME}" "${SOURCE_ASSET}" "${RELEASE_METADATA}" build-environment.txt SHA256SUMS)
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')"
            if [[ "${is_draft}" == "true" ]]; then
              gh release upload "${RELEASE_TAG}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
            else
              echo "A release publicada não será modificada."
            fi
          else
            flags=(--draft)
            [[ "${RELEASE_IS_PRERELEASE}" == "true" ]] && flags+=(--prerelease)
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${RELEASE_COMMIT}" \
              --title "${SOURCE_PREFIX} ${RELEASE_TAG} — ${RELEASE_STATUS}" \
              --generate-notes "${flags[@]}"
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}"
          fi
          if [[ "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')" == "true" ]]; then
            if [[ "${RELEASE_IS_PRERELEASE}" == "true" ]]; then
              gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --prerelease
            else
              gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --prerelease=false
            fi
          fi

  release-pretext:
    name: Publicar release PreTeXt
    needs: [resolve, build-pretext]
    if: always() && needs.resolve.outputs.build_system == 'pretext' && needs.build-pretext.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    outputs:
      pdf_sha256: ${{ steps.digest.outputs.pdf_sha256 }}

    env:
      RELEASE_PR_NUMBER: ${{ needs.resolve.outputs.release_pr_number }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.release_commit }}
      RELEASE_BASE_SHA: ${{ needs.resolve.outputs.release_base_sha }}
      RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
      RELEASE_DATE: ${{ needs.resolve.outputs.release_date }}
      RELEASE_STATUS: ${{ needs.resolve.outputs.release_status }}
      RELEASE_IS_PRERELEASE: ${{ needs.resolve.outputs.release_is_prerelease }}
      PDF_NAME: ${{ needs.resolve.outputs.pdf_name }}
      SOURCE_PREFIX: ${{ needs.resolve.outputs.source_prefix }}
      VALIDATION_SCRIPT: ${{ needs.resolve.outputs.validation_script }}

    steps:
      - name: Checkout do commit da release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_commit }}
          fetch-depth: 0

      - name: Baixar o PDF PreTeXt validado
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pretext-release-pdf
          path: pretext-release-assets

      - name: Baixar as fontes PreTeXt compactadas
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pretext-release-fonts
          path: pretext-release-assets

      - name: Baixar o checksum PreTeXt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pretext-release-checksums
          path: pretext-release-assets

      - name: Baixar o ambiente de compilação PreTeXt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pretext-build-environment
          path: pretext-release-assets

      - name: Baixar a saída web PreTeXt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pretext-release-web
          path: pretext-release-assets/web

      - name: Validar artefatos intermediários
        shell: bash
        run: |
          set -euo pipefail
          test -s "pretext-release-assets/${PDF_NAME}"
          test -s pretext-release-assets/pretext-fonts.tar.gz
          test -s pretext-release-assets/build-environment.txt
          test -f pretext-release-assets/web/index.html
          (
            cd pretext-release-assets
            sha256sum --check SHA256SUMS
          )
          git diff --check "${RELEASE_BASE_SHA}" "${RELEASE_COMMIT}"
          if [[ -n "${VALIDATION_SCRIPT}" ]]; then
            python3 "${VALIDATION_SCRIPT}" .
          fi

      - name: Empacotar fonte e checksums da release
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          metadata_file="${SOURCE_PREFIX}-${RELEASE_TAG}-metadata.txt"
          source_dir="${SOURCE_PREFIX}-${RELEASE_TAG}-source"
          source_asset="${source_dir}.tar.gz"
          release_date_display="$(date -u -d "${RELEASE_DATE}" +%d/%m/%Y)"
          {
            printf 'Livro: %s\n' "${GITHUB_REPOSITORY}"
            printf 'Versão: %s\n' "${RELEASE_TAG}"
            printf 'Data de publicação: %s\n' "${release_date_display}"
            printf 'Status editorial: %s\n' "${RELEASE_STATUS}"
            printf 'Commit: %s\n' "${RELEASE_COMMIT}"
            printf 'Release PR: #%s\n' "${RELEASE_PR_NUMBER}"
            printf 'Repositório: https://github.com/%s\n' "${GITHUB_REPOSITORY}"
          } > "${metadata_file}"
          git archive --format=tar --prefix="${source_dir}/" "${RELEASE_COMMIT}" | tar -x
          cp "${metadata_file}" "${source_dir}/"
          cp pretext-release-assets/build-environment.txt "${source_dir}/"
          tar -czf "${source_asset}" "${source_dir}"
          cp pretext-release-assets/SHA256SUMS pretext-build-SHA256SUMS
          cp pretext-release-assets/build-environment.txt build-environment.txt
          cp pretext-release-assets/pretext-fonts.tar.gz pretext-fonts.tar.gz
          tar -czf pretext-web.tar.gz -C pretext-release-assets/web .
          sha256sum "${PDF_NAME}" "${source_asset}" "${metadata_file}" \
            pretext-fonts.tar.gz pretext-web.tar.gz build-environment.txt \
            pretext-build-SHA256SUMS > SHA256SUMS
          pdf_sha256="$(sha256sum "${PDF_NAME}" | awk '{print $1}')"
          echo "pdf_sha256=${pdf_sha256}" >> "${GITHUB_OUTPUT}"
          echo "RELEASE_METADATA=${metadata_file}" >> "${GITHUB_ENV}"
          echo "SOURCE_ASSET=${source_asset}" >> "${GITHUB_ENV}"

      - name: Criar ou validar tag imutável
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --refs origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" == "${RELEASE_COMMIT}" ]] || {
              echo "A tag ${RELEASE_TAG} aponta para outro commit."
              exit 1
            }
          else
            git tag -a "${RELEASE_TAG}" "${RELEASE_COMMIT}" -m "${SOURCE_PREFIX} ${RELEASE_TAG}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Criar ou completar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=("${PDF_NAME}" pretext-fonts.tar.gz pretext-web.tar.gz "${SOURCE_ASSET}" "${RELEASE_METADATA}" build-environment.txt SHA256SUMS pretext-build-SHA256SUMS)
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')"
            if [[ "${is_draft}" == "true" ]]; then
              gh release upload "${RELEASE_TAG}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
            else
              echo "A release publicada não será modificada."
            fi
          else
            flags=(--draft)
            [[ "${RELEASE_IS_PRERELEASE}" == "true" ]] && flags+=(--prerelease)
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${RELEASE_COMMIT}" \
              --title "${SOURCE_PREFIX} ${RELEASE_TAG} — ${RELEASE_STATUS}" \
              --generate-notes "${flags[@]}"
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}"
          fi
          if [[ "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')" == "true" ]]; then
            if [[ "${RELEASE_IS_PRERELEASE}" == "true" ]]; then
              gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --prerelease
            else
              gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --prerelease=false
            fi
          fi

  dispatch:
    name: Propor atualização do catálogo
    needs: [resolve, build-latex, release-pretext]
    if: >-
      always() &&
      ((needs.resolve.outputs.build_system == 'latex' && needs.build-latex.result == 'success') ||
      (needs.resolve.outputs.build_system == 'pretext' && needs.release-pretext.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Criar token da REALMat Automation para o portal
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.REALMAT_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.REALMAT_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ needs.resolve.outputs.portal_name }}

      - name: Baixar o PDF publicado e montar payload
        id: payload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          PDF_NAME: ${{ needs.resolve.outputs.pdf_name }}
          EXPECTED_SHA256: ${{ needs.resolve.outputs.build_system == 'pretext' && needs.release-pretext.outputs.pdf_sha256 || needs.build-latex.outputs.pdf_sha256 }}
          RELEASE_STATUS: ${{ needs.resolve.outputs.release_status }}
          RELEASE_DATE: ${{ needs.resolve.outputs.release_date }}
          PORTAL_REPOSITORY: ${{ needs.resolve.outputs.portal_repository }}
          BOOK_TITLE: ${{ needs.resolve.outputs.book_title }}
          BOOK_SHORT_TITLE: ${{ needs.resolve.outputs.book_short_title }}
          BOOK_SUBJECT: ${{ needs.resolve.outputs.book_subject }}
          BOOK_ID: ${{ needs.resolve.outputs.book_id }}
          RUNNER_TEMP: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release-asset"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${PDF_NAME}" \
            --dir "${RUNNER_TEMP}/release-asset" \
            --clobber
          pdf_path="${RUNNER_TEMP}/release-asset/${PDF_NAME}"
          actual_sha256="$(sha256sum "${pdf_path}" | awk '{print $1}')"
          [[ "${actual_sha256}" == "${EXPECTED_SHA256}" ]] || {
            echo "O SHA-256 do PDF publicado diverge do build final."
            exit 1
          }
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          book = {
              "id": os.environ["BOOK_ID"],
              "title": os.environ["BOOK_TITLE"],
              "short_title": os.environ["BOOK_SHORT_TITLE"],
              "subject": os.environ["BOOK_SUBJECT"],
              "version": tag,
              "status": os.environ["RELEASE_STATUS"],
              "repository": repository,
              "ref": tag,
              "release_url": f"https://github.com/{repository}/releases/tag/{tag}",
              "pdf_url": f"https://github.com/{repository}/releases/download/{tag}/{os.environ['PDF_NAME']}",
              "pdf_path": f"/assets/books/{os.environ['BOOK_ID']}/{tag}/{os.environ['PDF_NAME']}",
              "sha256": os.environ["EXPECTED_SHA256"],
              "release_date": os.environ["RELEASE_DATE"],
          }
          Path(os.environ["RUNNER_TEMP"]).joinpath("catalog-dispatch.json").write_text(
              json.dumps({"event_type": "book-release", "client_payload": {"book": book}}, ensure_ascii=False),
              encoding="utf-8",
          )
          PY

      - name: Enviar evento ao portal
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PORTAL_REPOSITORY: ${{ needs.resolve.outputs.portal_repository }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${PORTAL_REPOSITORY}/dispatches" --input "${RUNNER_TEMP}/catalog-dispatch.json"
